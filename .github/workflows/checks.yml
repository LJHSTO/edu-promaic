name: 自动检查

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    name: ${{ matrix.os }} / Node.js ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [22, 24]
    steps:
      - name: 检出代码
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: 设置 Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - name: 安装检查工具
        run: npm ci --ignore-scripts
      - name: 语法检查
        run: npm run check
      - name: 静态检查
        run: npm run lint
      - name: 单元与接口测试
        run: npm test
      - name: 重复检查
        run: npm run quality:duplicates -- --threshold 0
      - name: 依赖审计
        run: npm audit --audit-level=high
      - name: 检查 Linux 服务单元
        if: runner.os == 'Linux'
        run: |
          unit_dir="$RUNNER_TEMP/edu-promaic-unit"
          mkdir -p "$unit_dir"
          sed "s|^ExecStart=/usr/bin/node |ExecStart=$(command -v node) |" deployment/linux/edu-promaic.service > "$unit_dir/edu-promaic.service"
          systemd-analyze --man=no --recursive-errors=no verify "$unit_dir/edu-promaic.service"
