# Include in the Nginx http context. Replace the example names and certificate paths.
log_format edu_promaic escape=json
    '{"time":"$time_iso8601","method":"$request_method","status":"$status","request_id":"$upstream_http_x_request_id"}';

server {
    listen 443 ssl;
    server_name learn.example.edu;
    ssl_certificate /etc/nginx/tls/classroom-chain.pem;
    ssl_certificate_key /etc/nginx/tls/classroom-key.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    large_client_header_buffers 4 16k;
    access_log /var/log/nginx/edu-promaic-access.log edu_promaic;

    location / {
        proxy_pass https://127.0.0.1:3443;
        proxy_set_header Host $host;
        proxy_set_header Origin $http_origin;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header Cookie $http_cookie;
        proxy_ssl_server_name on;
        proxy_ssl_name classroom-backend.example.edu;
        proxy_ssl_trusted_certificate /etc/nginx/trust/classroom-ca.pem;
        proxy_ssl_verify on;
        proxy_ssl_verify_depth 3;
        proxy_ssl_protocols TLSv1.2 TLSv1.3;
        proxy_cache off;
        proxy_intercept_errors off;
    }
}
